# =====================================================
# COGNIFY PRODUCTION CONFIGURATION
# =====================================================
# Activated by: SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=${PORT:8080}

# Allow larger request bodies for base64 image uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# Resources folder path (in Docker, folder is at same level as JAR)
resources.path=resources

# =====================================================
# DATABASE CONFIGURATION (PostgreSQL)
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =====================================================
# GEMINI AI CONFIGURATION
# =====================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.models.primary=gemini-3.1-flash-lite-preview
gemini.models.secondary=gemini-3-flash-preview
gemini.models.tertiary=gemini-2.5-flash-lite

# =====================================================
# JWT CONFIGURATION
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =====================================================
# SECURITY
# =====================================================
# Disable H2 Console in production
spring.h2.console.enabled=false

# =====================================================
# LOGGING
# =====================================================
logging.level.com.cognify=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
