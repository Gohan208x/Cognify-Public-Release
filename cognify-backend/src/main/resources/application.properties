# =====================================================
# COGNIFY BACKEND CONFIGURATION
# =====================================================

# Server Configuration
server.port=${PORT:8080}

# =====================================================
# DATABASE CONFIGURATION (H2 File-Based for Persistence)
# =====================================================
# Data is stored in ./data/cognifydb on disk and persists between restarts
spring.datasource.url=jdbc:h2:file:./data/cognifydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for debugging) - accessible at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
# Use 'update' to create/update tables without losing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================================
# GEMINI AI CONFIGURATION
# =====================================================
# Set your Gemini API key via the GEMINI_API_KEY environment variable
gemini.api.key=${GEMINI_API_KEY:}

gemini.models.primary=gemini-3.1-flash-lite-preview
gemini.models.secondary=gemini-3-flash-preview
gemini.models.tertiary=gemini-2.5-flash-lite

# =====================================================
# JWT CONFIGURATION
# =====================================================
# Set your base64-encoded secret key via JWT_SECRET environment variable.
# If omitted during local development, a secure in-memory key is generated automatically.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# =====================================================
# CORS CONFIGURATION
# =====================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================================
# LOGGING
# =====================================================
logging.level.com.cognify=DEBUG
logging.level.org.springframework.security=INFO
